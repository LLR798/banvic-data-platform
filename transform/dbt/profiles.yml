# Nenhuma credencial aqui: tudo vem de variáveis de ambiente injetadas
# pelo Kubernetes (ConfigMap pipeline-config + Secret dw-transform-credentials).
banvic:
  target: "{{ env_var('DBT_TARGET', 'prod') }}"
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('DW_HOST') }}"
      port: "{{ env_var('DW_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DW_DATABASE') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      schema: silver
      threads: 4
      connect_timeout: 15
      retries: 3
