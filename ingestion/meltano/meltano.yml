# -----------------------------------------------------------------------------
# Projeto Meltano — camada BRONZE do BanVic
#
# Extração: tap-csv lê os 7 CSVs do ERP (baixados da zona bronze do MinIO
#           para ${BANVIC_INPUT_DIR} pelo runner antes da execução).
# Carga:    target-postgres grava em bronze.<tabela> no DW.
#
# Os plugins são definidos aqui por completo (namespace, pip_url, settings),
# sem depender do Meltano Hub no build: a imagem é 100% reprodutível.
#
# SEGREDOS: nenhum valor sensível neste arquivo.
#   - TARGET_POSTGRES_USER / TARGET_POSTGRES_PASSWORD -> K8s Secret
#   - DW_HOST / DW_PORT / DW_DATABASE                 -> K8s ConfigMap
# -----------------------------------------------------------------------------
requires_meltano: ">=4.4,<5"
default_environment: prod
project_id: banvic-bronze-ingestion
send_anonymous_usage_stats: false

environments:
  - name: dev
  - name: prod

plugins:
  extractors:
    - name: tap-csv
      namespace: tap_csv
      pip_url: git+https://github.com/MeltanoLabs/tap-csv.git@v1.3.2
      executable: tap-csv
      capabilities: [discover, catalog, about]
      settings:
        - name: files
          kind: array
        - name: add_metadata_columns
          kind: boolean
      config:
        # Linhagem: adiciona _sdc_source_file, _sdc_source_file_mtime e
        # _sdc_source_lineno. O runner baixa os arquivos para
        # .../ingestion_date=AAAA-MM-DD/<tabela>.csv, então _sdc_source_file
        # registra de qual partição do lake cada linha veio.
        add_metadata_columns: true
        # Contrato das 7 tabelas do ERP: entidade, arquivo e chave primária.
        # As PKs (keys) garantem que reexecuções façam UPSERT, não duplicação.
        files:
          - entity: agencias
            path: ${BANVIC_INPUT_DIR}/agencias.csv
            keys: [cod_agencia]
          - entity: colaboradores
            path: ${BANVIC_INPUT_DIR}/colaboradores.csv
            keys: [cod_colaborador]
          - entity: colaborador_agencia
            path: ${BANVIC_INPUT_DIR}/colaborador_agencia.csv
            keys: [cod_colaborador, cod_agencia]
          - entity: clientes
            path: ${BANVIC_INPUT_DIR}/clientes.csv
            keys: [cod_cliente]
          - entity: contas
            path: ${BANVIC_INPUT_DIR}/contas.csv
            keys: [num_conta]
          - entity: propostas_credito
            path: ${BANVIC_INPUT_DIR}/propostas_credito.csv
            keys: [cod_proposta]
          - entity: transacoes
            path: ${BANVIC_INPUT_DIR}/transacoes.csv
            keys: [cod_transacao]

  loaders:
    - name: target-postgres
      namespace: target_postgres
      pip_url: meltanolabs-target-postgres==0.8.0
      executable: target-postgres
      settings:
        - name: host
        - name: port
          kind: integer
        - name: database
        - name: user
        - name: password
          kind: string
          sensitive: true
        - name: default_target_schema
        - name: add_record_metadata
          kind: boolean
        - name: load_method
          kind: options
          options:
            - label: Append only
              value: append-only
            - label: Upsert
              value: upsert
            - label: Overwrite
              value: overwrite
        - name: validate_records
          kind: boolean
      config:
        host: ${DW_HOST}
        port: ${DW_PORT}
        database: ${DW_DATABASE}
        default_target_schema: bronze
        # _sdc_extracted_at, _sdc_received_at, _sdc_batched_at, ...
        add_record_metadata: true
        # Snapshot completo do ERP + PK declarada = UPSERT idempotente.
        load_method: upsert
        validate_records: true
